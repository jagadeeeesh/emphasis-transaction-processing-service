spring:
  application:
    name: emphasis-transaction-processing-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

processing:
  max-retries: 3
  initial-sequence: 1
  failure-simulation:
    fail-first-attempt-for:
      - TXN-2005

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%thread] %logger{40} - %msg%n"
  level:
    root: INFO
    com.emphasis.transactionprocessor: INFO
